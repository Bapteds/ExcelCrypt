/* ============================================================
   Contrôle avant envoi
   ============================================================ */
function leakModal(findings) {
  S.findings = findings;
  const total = findings.reduce((a, f) => a + f.count, 0);
  modal(`
    <div class="modal-h"><div class="mi warn">${icon("alert", "lg")}</div>
      <div><h2 id="modal-title">${t("scanTitle")}</h2><p>${t("scanSub", total)}</p></div>
      <button class="btn icon ghost x" onclick="closeModal()" aria-label="${esc(t("close"))}">${icon("x")}</button></div>
    <div class="modal-b"><div class="findings">${findings.map((f, i) => {
      const fix = f.detector === "masked_value" ? t("scanFixPropagate") : f.detector === "regex" ? "" : t("scanFixDetector", t("det_" + f.detector));
      const where = t("scanWhere", f.sheet === "(csv)" ? "CSV" : f.sheet, f.letter, f.header);
      return `<label class="finding"><input type="checkbox" data-i="${i}" ${fix ? "checked" : "disabled"}>
        <div><b>${esc(t("det_" + f.detector))} · ${t("scanCount", f.count)}</b>
        <span class="where">${esc(where)} · <code>${esc(f.example)}</code></span>
        ${fix ? `<span class="fix">${esc(fix)}</span>` : ""}</div></label>`;
    }).join("")}</div></div>
    <div class="modal-f">
      <button class="btn ghost" onclick="closeModal()">${t("scanBack")}</button>
      <button class="btn secondary" onclick="ignoreLeaks()">${t("scanIgnore")}</button>
      <button class="btn primary" onclick="fixLeaks()">${icon("shield", "sm")}${t("scanFix")}</button>
    </div>`);
  $("#modal-box").classList.add("wide");
}
function fixLeaks() {
  pushHistory();
  let remaining = 0;
  $("#modal-box").querySelectorAll(".finding input").forEach((cb) => {
    const f = S.findings[+cb.dataset.i];
    if (!cb.checked) { remaining++; return; }
    if (f.detector === "masked_value") S.opts.propagate = true;
    else if (!S.opts.detectors.includes(f.detector)) S.opts.detectors.push(f.detector);
  });
  syncOpts(); renderSummary(); refreshAi();
  S.scanClean = remaining === 0;
  closeModal();
  doEncrypt(true);
}
function ignoreLeaks() { S.scanClean = false; closeModal(); doEncrypt(true); }

/* ============================================================
   Profils
   ============================================================ */
function renderProfiles() {
  const sel_ = $("#profile-select");
  if (!sel_) return;
  sel_.innerHTML = `<option value="">${esc(t("noProfile"))}</option>` +
    S.profiles.map((p) => `<option value="${esc(p.name)}" ${p.name === S.profile ? "selected" : ""}>${esc(p.name)}</option>`).join("");
  $("#profile-del").hidden = !S.profile;
  $("#profile-batch").hidden = !S.profile;
}
async function loadProfiles() { S.profiles = await api.list_profiles(); renderProfiles(); }
function headerIndex() {
  const idx = new Set();
  for (const s of S.sheets) for (const c of s.columns) if (c.name) idx.add(c.name.trim().toLowerCase());
  return idx;
}
/* Profil dont toutes les colonnes existent dans le fichier (le plus complet l'emporte) */
function bestProfile() {
  const h = headerIndex();
  return S.profiles.filter((p) => p.columns?.length && p.columns.every((c) => h.has(c.trim().toLowerCase())))
    .sort((a, b) => b.columns.length - a.columns.length)[0] || null;
}
function applyProfile(p, auto = false) {
  pushHistory();
  const wanted = new Set((p.columns || []).map((c) => c.trim().toLowerCase()));
  let n = 0;
  for (const s of S.sheets) {
    const m = sel(s.name);
    for (const c of s.columns) if (c.name && wanted.has(c.name.trim().toLowerCase())) { m.cols.add(c.idx); n++; }
  }
  S.opts = { ...S.opts, ...(p.opts || {}), detectors: [...(p.opts?.detectors || [])],
             values: [...(p.values || [])], regexes: [...(p.regexes || [])] };
  S.profile = p.name;
  syncOpts(); renderProfiles(); renderAll();
  if (auto) toast(t("profileAuto", p.name), "info", { label: t("undoAction"), fn: () => { undo(); S.profile = ""; renderProfiles(); } });
  else toast(t("profileApplied", p.name, n), "ok");
}
function onProfileSelect(name) {
  S.profile = name;
  const p = S.profiles.find((x) => x.name === name);
  if (p && S.file) applyProfile(p);
  renderProfiles();
}
function profileColumns() {
  const names = [];
  for (const s of S.sheets) {
    const m = sel(s.name);
    for (const c of s.columns) if (m.cols.has(c.idx) && c.name && !names.some((x) => x.toLowerCase() === c.name.toLowerCase())) names.push(c.name);
  }
  return names;
}
function saveProfileModal() {
  const cols = profileColumns(), o = S.opts;
  if (!cols.length && !o.detectors.length && !o.values.length && !o.regexes.length) return toast(t("nothingToSave"), "info");
  const manual = S.sheets.some((s) => { const m = sel(s.name); return m.rows.size || m.cells.size || m.ranges.length; });
  const suggestion = S.profile || (S.file ? S.file.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ") : "");
  modal(`
    <div class="modal-h"><div class="mi">${icon("save", "lg")}</div>
      <div><h2 id="modal-title">${t("saveProfileTitle")}</h2><p>${t("saveProfileSub")}</p></div></div>
    <div class="modal-b">
      <div class="field"><label for="profile-name">${t("profileName")}</label>
        <input class="input" id="profile-name" value="${esc(suggestion)}" placeholder="${esc(t("profileNamePh"))}" autocomplete="off">
        <div class="help" id="profile-overwrite" hidden>${t("profileOverwrite")}</div>
        <div class="field-err" id="profile-err" role="alert" hidden></div></div>
      <div class="field"><label>${t("profileContent")}</label>
        <div class="man-list">${cols.length ? cols.map((c) => `<span class="chip">${icon("lock", "sm")}<span>${esc(c)}</span></span>`).join("") : `<span class="help" style="margin:0">${t("profileNone")}</span>`}
        ${o.detectors.map((d) => `<span class="chip">${icon("id", "sm")}<span>${esc(t("det_" + d))}</span></span>`).join("")}
        ${o.maskHeaders ? `<span class="chip">${icon("heading", "sm")}<span>${t("sumHeaders")}</span></span>` : ""}
        ${o.propagate ? `<span class="chip">${icon("share", "sm")}<span>${t("sumPropagate")}</span></span>` : ""}
        ${o.readable ? `<span class="chip">${icon("tag", "sm")}<span>${t("sumReadable")}</span></span>` : ""}
        ${o.values.length ? `<span class="chip">${icon("type", "sm")}<span>${t("sumValues", o.values.length)}</span></span>` : ""}
        ${o.regexes.length ? `<span class="chip">${icon("code", "sm")}<span>${t("sumRegex", o.regexes.length)}</span></span>` : ""}</div>
        ${manual ? `<div class="help">${t("profileNoPositions")}</div>` : ""}</div>
    </div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">${t("cancel")}</button><button class="btn primary" onclick="saveProfile()">${icon("save", "sm")}${t("saveProfile")}</button></div>`);
  const input = $("#profile-name");
  const check = () => { $("#profile-overwrite").hidden = !S.profiles.some((p) => p.name.toLowerCase() === input.value.trim().toLowerCase()); };
  input.addEventListener("input", check);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") saveProfile(); });
  check(); input.focus(); input.select();
}
async function saveProfile() {
  const name = $("#profile-name").value.trim();
  if (!name) { const e = $("#profile-err"); e.hidden = false; e.textContent = t("err_profile_name"); $("#profile-name").classList.add("err"); return; }
  const o = S.opts;
  const r = await api.save_profile({ name, columns: profileColumns(), headerRow: S.headerRow, values: o.values, regexes: o.regexes,
    opts: { detectors: o.detectors, maskHeaders: o.maskHeaders, propagate: o.propagate, readable: o.readable } });
  if (r.error) return errorModal(t("saveProfileTitle"), errText(r));
  S.profiles = r.profiles; S.profile = name;
  renderProfiles(); closeModal(); toast(t("profileSaved", name), "ok");
}
function deleteProfileModal() {
  if (!S.profile) return;
  modal(`
    <div class="modal-h"><div class="mi warn">${icon("trash", "lg")}</div>
      <div><h2 id="modal-title">${esc(t("deleteProfileTitle", S.profile))}</h2><p>${t("deleteProfileSub")}</p></div></div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">${t("cancel")}</button><button class="btn primary" onclick="deleteProfile()">${icon("trash", "sm")}${t("delete")}</button></div>`);
}
async function deleteProfile() {
  const r = await api.delete_profile(S.profile);
  S.profiles = r.profiles; S.profile = "";
  renderProfiles(); closeModal(); toast(t("profileDeleted"), "ok");
}

/* ============================================================
   Traitement d'un dossier entier
   ============================================================ */
function batchModal() {
  if (!requireKey()) return;
  const has = S.profiles.length > 0, cur_ = S.profile || S.profiles[0]?.name || "";
  modal(`
    <div class="modal-h"><div class="mi">${icon("folders", "lg")}</div>
      <div><h2 id="modal-title">${t("batchTitle")}</h2><p>${t("batchSub")}</p></div>
      <button class="btn icon ghost x" onclick="closeModal()" aria-label="${esc(t("close"))}">${icon("x")}</button></div>
    <div class="modal-b">${has ? `<div class="field"><label for="batch-profile">${t("profile")}</label><div class="select-wrap">
      <select class="input" id="batch-profile">${S.profiles.map((p) => `<option value="${esc(p.name)}" ${p.name === cur_ ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select>
      ${icon("chevron", "sm")}</div></div>` : `<div class="note info">${icon("info", "sm")}<div>${t("batchNoProfile")}</div></div>`}</div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">${t("cancel")}</button>
      <button class="btn primary" ${has ? "" : "disabled"} onclick="runBatch('encrypt', $('#batch-profile').value)">${icon("folder", "sm")}${t("chooseFolder")}</button></div>`);
}
function batchRestoreModal() {
  if (!requireKey()) return;
  if (!S.vault?.exists) return errorModal(t("vaultMissingTitle"), t("vaultMissingMsg"), [[t("chooseVaultBtn"), "chooseVault()"]]);
  modal(`
    <div class="modal-h"><div class="mi">${icon("folders", "lg")}</div>
      <div><h2 id="modal-title">${t("batchRestoreTitle")}</h2><p>${t("batchRestoreSub")}</p></div>
      <button class="btn icon ghost x" onclick="closeModal()" aria-label="${esc(t("close"))}">${icon("x")}</button></div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">${t("cancel")}</button>
      <button class="btn primary" onclick="runBatch('decrypt')">${icon("folder", "sm")}${t("chooseFolder")}</button></div>`);
}
async function runBatch(kind, profile) {
  closeModal();
  setBusy(true);
  const res = kind === "encrypt" ? await api.batch_encrypt(profile) : await api.batch_decrypt();
  setBusy(false);
  closeModal();
  if (res.cancelled) return;
  if (res.error) return errorModal(kind === "encrypt" ? t("encryptFailed") : t("restoreFailed"), errText(res));
  if (res.state) applyState(res.state);
  const ok = res.results.filter((r) => r.ok).length;
  modal(`
    <div class="modal-h"><div class="mi ${ok === res.results.length ? "ok" : "warn"}">${icon(ok === res.results.length ? "check" : "alert", "lg")}</div>
      <div><h2 id="modal-title">${t("batchDone")}</h2><p>${t("batchSummary", ok, res.results.length)}</p></div>
      <button class="btn icon ghost x" onclick="closeModal()" aria-label="${esc(t("close"))}">${icon("x")}</button></div>
    <div class="modal-b"><div class="batch-list">${res.results.map((r) => `<div class="batch-item">
      <div class="st ${r.ok ? "ok" : "bad"}">${icon(r.ok ? "check" : "x", "sm")}</div>
      <div style="min-width:0;flex:1"><b title="${esc(r.name)}">${esc(r.name)}</b>
      <span>${!r.ok ? esc(errText(r)) : kind === "encrypt" ? t("batchMasked", r.masked) : t("batchRestored", r.restored)}</span>
      ${r.ok && r.leaks ? ` · <span class="warn">${t("batchLeaks", r.leaks)}</span>` : ""}
      ${r.ok && r.unknown ? ` · <span class="warn">${t("batchUnknown", r.unknown)}</span>` : ""}</div></div>`).join("")}</div></div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">${t("close")}</button>
      <button class="btn primary" onclick="api.reveal(${esc(JSON.stringify(res.folder))})">${icon("folder", "sm")}${t("openFolder")}</button></div>`);
  $("#modal-box").classList.add("wide");
}
window.onBatchProgress = (i, n, name) => {
  if (!$("#busy-bar")) showBusy(t("batchRunning", i, n), 0);
  $("#modal-title").textContent = t("batchRunning", i, n);
  const p = $("#modal-box").querySelector(".modal-h p");
  if (p && name) p.textContent = name;
  window.onTaskProgress(n ? (i / n) * 100 : 100);
};

/* ============================================================
   Toasts & infobulles
   ============================================================ */
let toastSeq = 0;
const toastActions = {};
function toast(msg, kind = "info", action = null) {
  const el = document.createElement("div");
  el.className = `toast ${kind}`;
  const id = ++toastSeq;
  if (action) toastActions[id] = action.fn;
  el.innerHTML = `${icon(kind === "ok" ? "check" : kind === "bad" ? "alert" : "info")}<span>${esc(msg)}</span>${action ? `<button class="act" onclick="runToastAction(${id}, this)">${esc(action.label)}</button>` : ""}`;
  $("#toasts").appendChild(el);
  setTimeout(() => { el.classList.add("out"); setTimeout(() => { el.remove(); delete toastActions[id]; }, 140); }, action ? 7000 : 4000);
}
function runToastAction(id, btn) {
  toastActions[id]?.();
  delete toastActions[id];
  btn.closest(".toast").remove();
}
const tip = $("#tip");
let tipTimer = null;
document.addEventListener("mouseover", (e) => {
  const el = e.target.closest("[data-tip]");
  clearTimeout(tipTimer);
  if (!el || drag) return hideTip();
  tipTimer = setTimeout(() => {
    tip.innerHTML = `<small>${esc(el.dataset.tipTitle || "")}</small><div>${esc(el.dataset.tip)}</div>`;
    const r = el.getBoundingClientRect();
    tip.classList.add("show");
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let x = Math.min(r.left, innerWidth - tw - 12), y = r.bottom + 6;
    if (y + th > innerHeight - 8) y = r.top - th - 6;
    tip.style.left = Math.max(8, x) + "px"; tip.style.top = y + "px";
  }, 250);
});
function hideTip() { tip.classList.remove("show"); }
document.addEventListener("scroll", hideTip, true);

/* ============================================================
   Glisser-déposer (le chemin complet est fourni par Python)
   ============================================================ */
let dragDepth = 0;
const veil = $("#veil");
document.addEventListener("dragenter", (e) => {
  e.preventDefault();
  if (++dragDepth === 1) {
    $("#veil-t").textContent = S.mode === "restore" ? t("veilRestore") : t("veilOpen");
    veil.classList.add("show");
  }
});
document.addEventListener("dragleave", (e) => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; veil.classList.remove("show"); } });
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", (e) => { e.preventDefault(); dragDepth = 0; veil.classList.remove("show"); });
window.onFileDropped = (path) => {
  if (S.busy || S.langRequired) return;
  if (S.mode === "restore") doDecrypt(path);
  else loadFile(path, 1);
};

/* ============================================================
   Clavier
   ============================================================ */
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("#modal").classList.contains("show") && !S.busy) closeModal();
  if (S.langRequired) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z" && !e.shiftKey && !e.target.closest("input, textarea") && S.mode === "protect" && !$("#modal").classList.contains("show")) { e.preventDefault(); undo(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "o") { e.preventDefault(); S.mode === "restore" ? doDecrypt() : pickAndLoad(); }
});
$("#modal").addEventListener("click", (e) => { if (e.target.id === "modal" && !S.busy) closeModal(); });

setupChips("values", "#in-values");
setupChips("regexes", "#in-regex");

</script>
