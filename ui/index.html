<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExcelCrypt</title>
<style>
/* ============================================================
   Jetons DIVE Turbinen (design-system.md §2 à §4) - thème clair uniquement
   ============================================================ */
:root {
  --color-primary: #004A99;
  --color-primary-hover: #003A78;
  --color-primary-light: #1E63B5;
  --color-primary-tint: #E8F0F9;
  --color-primary-wash: rgba(0, 74, 153, .045);   /* dérivé du bleu : cellules protégées */
  --color-accent: #EE7F00;
  --color-accent-hover: #CC6E00;
  --color-accent-tint: #FFF3E6;
  --color-cta: #A85F00;
  --color-cta-hover: #8C4E00;
  --color-neutral: #BCBDBF;
  --color-bg: #F5F7FA;
  --color-surface: #FFFFFF;
  --color-text: #1A2230;
  --color-text-secondary: #5B6676;
  --color-border: #E4E8EE;
  --color-border-strong: #BCBDBF;
  --color-success: #1E7B4F;
  --color-success-tint: #E7F4EE;
  --color-danger: #B42318;
  --color-danger-hover: #911A12;
  --color-danger-tint: #FDECEA;
  --color-focus-ring: #1E63B5;

  --radius-xs: 4px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(16, 24, 40, .05);
  --shadow-md: 0 4px 12px rgba(16, 24, 40, .08);
  --shadow-lg: 0 12px 32px rgba(16, 24, 40, .10);
  --ease: cubic-bezier(.16, 1, .3, 1);
  --dur: 170ms;
  --z-sticky: 1100; --z-overlay: 1200; --z-modal: 1300; --z-toast: 1400; --z-tooltip: 1500;

  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--color-bg); color: var(--color-text);
  font: 14px/20px var(--font); font-feature-settings: "cv05", "ss01";
  -webkit-font-smoothing: antialiased; overflow: hidden;
  user-select: none; -webkit-user-select: none;
}
input, textarea { user-select: text; -webkit-user-select: text; }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 16px; height: 16px; }
svg.i.lg { width: 22px; height: 22px; }
svg.i.xl { width: 32px; height: 32px; stroke-width: 1.5; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: 2px; }

/* Losange DIVE : repère discret (§1), jamais plein orange, un par zone */
.diamond { display: inline-block; width: 7px; height: 7px; background: var(--color-primary); transform: rotate(45deg); flex: none; }
.diamond.outline { background: transparent; border: 1.5px solid var(--color-primary); }

/* ---------- boutons (§6) ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 16px; border-radius: var(--radius-sm);
  border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text);
  font-weight: 500; cursor: pointer; white-space: nowrap;
  transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease), transform 80ms var(--ease);
}
.btn:hover { background: var(--color-bg); border-color: var(--color-border-strong); }
.btn:active { transform: translateY(1px); }
.btn:disabled { background: var(--color-border); border-color: var(--color-border); color: var(--color-text-secondary); cursor: not-allowed; transform: none; }
.btn.primary { background: var(--color-cta); border-color: var(--color-cta); color: #fff; font-weight: 700; }
.btn.primary:hover:not(:disabled) { background: var(--color-cta-hover); border-color: var(--color-cta-hover); }
.btn.primary:disabled { background: var(--color-border); border-color: var(--color-border); color: var(--color-text-secondary); }
.btn.secondary { background: transparent; border-color: var(--color-primary); color: var(--color-primary); }
.btn.secondary:hover { background: var(--color-primary-tint); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--color-text-secondary); }
.btn.ghost:hover { background: var(--color-bg); color: var(--color-text); }
.btn.lg { height: 44px; font-size: 15px; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn.icon { width: 40px; padding: 0; }

/* ---------- en-tête (§5) ---------- */
.topbar {
  height: 64px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px;
  padding: 0 24px; border-bottom: 1px solid var(--color-border); background: var(--color-surface);
  position: relative; z-index: var(--z-sticky);
}
.brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
.brand-logo { height: 34px; width: auto; display: block; }
.brand-sep { width: 1px; height: 28px; background: var(--color-border); }
.brand b { font-size: 15px; font-weight: 600; color: var(--color-primary); letter-spacing: -.01em; display: block; line-height: 18px; }
.brand small { color: var(--color-text-secondary); font-size: 12px; font-weight: 500; }

.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-sm); }
.seg button {
  display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px;
  border: 0; border-radius: 6px; background: transparent; color: var(--color-text-secondary); font-weight: 500; cursor: pointer;
  transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.seg button:hover { color: var(--color-text); }
.seg button[aria-selected="true"] { background: var(--color-surface); color: var(--color-primary); font-weight: 600; box-shadow: var(--shadow-sm), 0 0 0 1px var(--color-border); }
.seg.sm button { height: 28px; padding: 0 10px; font-size: 13px; }

.status-pills { display: flex; justify-content: flex-end; gap: 8px; }
.pill {
  display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px;
  border-radius: var(--radius-sm); border: 1px solid var(--color-border); background: var(--color-surface);
  color: var(--color-text); font-size: 13px; font-weight: 500; cursor: pointer; max-width: 240px;
  transition: border-color var(--dur), background-color var(--dur);
}
.pill:hover { border-color: var(--color-border-strong); background: var(--color-bg); }
.pill svg.i { color: var(--color-text-secondary); }
.pill .state { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--color-success); }
.pill.bad { border-color: #F1B9B3; background: var(--color-danger-tint); }
.pill.bad .state { color: var(--color-danger); }
.pill.warn .state { color: var(--color-text-secondary); }
.pill span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- vues ---------- */
main { height: calc(100% - 64px); position: relative; }
.view { position: absolute; inset: 0; display: none; }
.view.active { display: flex; animation: fadeIn 180ms var(--ease); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ---------- écrans d'accueil ---------- */
.welcome { flex-direction: column; align-items: center; justify-content: center; padding: 32px; overflow: auto; }
.welcome .mark { display: flex; align-items: center; gap: 10px; color: var(--color-text-secondary); font-size: 12px; font-weight: 500; margin-bottom: 12px; }
.welcome h1 { font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -.01em; margin: 0 0 8px; text-align: center; }
.welcome p.lead { color: var(--color-text-secondary); margin: 0 0 32px; text-align: center; max-width: 560px; font-size: 15px; line-height: 24px; }
.dropzone {
  width: min(640px, 100%); border: 1.5px dashed var(--color-border-strong); border-radius: var(--radius-lg);
  background: var(--color-surface); padding: 40px 32px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
  cursor: pointer; transition: border-color var(--dur), background-color var(--dur);
}
.dropzone:hover, .dropzone.over { border-color: var(--color-primary); background: var(--color-primary-wash); }
.dz-icon {
  width: 60px; height: 60px; border-radius: var(--radius-md); display: grid; place-items: center;
  background: var(--color-primary-tint); color: var(--color-primary);
}
.dropzone h2 { margin: 4px 0 0; font-size: 18px; line-height: 28px; font-weight: 600; }
.dropzone p { margin: 0; color: var(--color-text-secondary); }
.dropzone u { color: var(--color-primary); text-underline-offset: 3px; }
.formats { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
.formats span { font: 500 12px var(--mono); color: var(--color-text-secondary); padding: 2px 8px; border-radius: var(--radius-xs); border: 1px solid var(--color-border); background: var(--color-bg); }
.kbd { font: 12px var(--mono); padding: 1px 6px; border-radius: var(--radius-xs); border: 1px solid var(--color-border-strong); color: var(--color-text-secondary); background: var(--color-bg); }

.steps { display: grid; grid-template-columns: repeat(3, 1fr); width: min(860px, 100%); margin-top: 32px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); }
.step { padding: 16px 20px; display: flex; gap: 12px; }
.step + .step { border-left: 1px solid var(--color-border); }
.step .n { font: 600 12px var(--mono); color: var(--color-primary); padding-top: 1px; }
.step b { display: block; font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.step span { color: var(--color-text-secondary); font-size: 13px; }

.checklist { width: min(640px, 100%); margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.check { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-md); background: var(--color-surface); border: 1px solid var(--color-border); font-size: 13px; }
.check .ico { width: 30px; height: 30px; border-radius: var(--radius-sm); display: grid; place-items: center; flex: none; }
.check.ok .ico { background: var(--color-success-tint); color: var(--color-success); }
.check.bad .ico { background: var(--color-danger-tint); color: var(--color-danger); }
.check b { display: block; font-weight: 600; }
.check span { color: var(--color-text-secondary); }
.check .btn { margin-left: auto; }

/* ---------- espace de travail ---------- */
.workspace { grid-template-columns: 340px 1fr; }
.view.workspace.active { display: grid; }
.sidebar { border-right: 1px solid var(--color-border); background: var(--color-surface); display: flex; flex-direction: column; min-height: 0; }
.sidebar-scroll { overflow: auto; flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 24px; min-height: 0; }
.file-card { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius-md); background: var(--color-bg); border: 1px solid var(--color-border); }
.file-card .ic { width: 40px; height: 40px; border-radius: var(--radius-sm); display: grid; place-items: center; background: var(--color-surface); border: 1px solid var(--color-border); color: var(--color-primary); flex: none; }
.file-card .meta { min-width: 0; flex: 1; }
.file-card b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 600; }
.file-card span { color: var(--color-text-secondary); font-size: 12px; }

.section-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.section-h h3 { margin: 0; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.badge { font: 500 12px/16px var(--font); padding: 2px 8px; border-radius: var(--radius-sm); background: var(--color-primary-tint); color: var(--color-primary); }
.badge.muted { background: var(--color-bg); color: var(--color-text-secondary); border: 1px solid var(--color-border); }
.badge.ok { background: var(--color-success-tint); color: var(--color-success); }
.badge.bad { background: var(--color-danger-tint); color: var(--color-danger); }

.search { position: relative; margin-bottom: 8px; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--color-text-secondary); }
.input {
  width: 100%; height: 40px; padding: 0 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); font: inherit;
  transition: border-color var(--dur);
}
.input::placeholder, .chips input::placeholder { color: #8A94A3; }
.input:hover { border-color: var(--color-border-strong); }
.input:focus { border-color: var(--color-primary); outline: 2px solid var(--color-focus-ring); outline-offset: 2px; }
.search .input { padding-left: 36px; }
.col-actions { display: flex; gap: 8px; margin-bottom: 8px; }
.col-actions .btn { flex: 1; }

.col-list { display: flex; flex-direction: column; border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; }
.col-item {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 0; border-top: 1px solid var(--color-border);
  cursor: pointer; text-align: left; width: 100%; background: var(--color-surface); transition: background-color var(--dur);
}
.col-item:first-child { border-top: 0; }
.col-item:hover { background: var(--color-bg); }
.col-item.on { background: var(--color-primary-tint); }
.col-letter { font: 600 11px var(--mono); width: 28px; height: 22px; border-radius: var(--radius-xs); display: grid; place-items: center; background: var(--color-bg); border: 1px solid var(--color-border); color: var(--color-text-secondary); flex: none; }
.col-item.on .col-letter { background: var(--color-surface); border-color: #B8CDE6; color: var(--color-primary); }
.col-main { flex: 1; min-width: 0; }
.col-main b { display: block; font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.col-item.on .col-main b { color: var(--color-primary); font-weight: 600; }
.col-main b.none { color: var(--color-text-secondary); font-style: italic; font-weight: 400; }
.col-main > span.num { white-space: normal; }
.col-main > span { display: block; color: var(--color-text-secondary); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag-sug { display: inline-flex; align-items: center; gap: 4px; color: var(--color-text); font-weight: 500; vertical-align: -2px; }
.tag-sug svg.i { width: 12px; height: 12px; color: var(--color-accent-hover); }

.switch { width: 34px; height: 20px; border-radius: 10px; background: var(--color-neutral); position: relative; flex: none; transition: background-color var(--dur) var(--ease); }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm); transition: transform var(--dur) var(--ease); }
.on > .switch { background: var(--color-primary); }
.on > .switch::after { transform: translateX(14px); }

.opt-list { border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; }
.opt-row {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; width: 100%; text-align: left;
  background: var(--color-surface); border: 0; border-top: 1px solid var(--color-border); cursor: pointer; transition: background-color var(--dur);
}
.opt-row:first-child { border-top: 0; }
.opt-row:hover { background: var(--color-bg); }
.opt-row.on { background: var(--color-primary-tint); }
.opt-row .ic { color: var(--color-text-secondary); }
.opt-row.on .ic { color: var(--color-primary); }
.opt-row .txt { flex: 1; }
.opt-row .txt b { display: block; font-weight: 500; font-size: 14px; }
.opt-row .txt span { color: var(--color-text-secondary); font-size: 12px; }

.chips-field { margin-top: 16px; }
.chips-field label { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
.chips-field label svg { color: var(--color-text-secondary); }
.chips {
  display: flex; flex-wrap: wrap; gap: 6px; padding: 7px; min-height: 40px; border-radius: var(--radius-sm);
  border: 1px solid var(--color-border); background: var(--color-surface); cursor: text; transition: border-color var(--dur);
}
.chips:hover { border-color: var(--color-border-strong); }
.chips:focus-within { border-color: var(--color-primary); outline: 2px solid var(--color-focus-ring); outline-offset: 2px; }
.chips input { flex: 1; min-width: 90px; border: 0; background: transparent; color: var(--color-text); font: inherit; height: 24px; padding: 0 4px; }
.chips input:focus { outline: none; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 4px 0 8px; border-radius: var(--radius-xs);
  background: var(--color-primary-tint); color: var(--color-primary); font-size: 13px; font-weight: 500; max-width: 100%;
}
.chip.mono { font-family: var(--mono); font-size: 12px; }
.chip.err { background: var(--color-danger-tint); color: var(--color-danger); }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip button { border: 0; background: transparent; cursor: pointer; padding: 2px; border-radius: var(--radius-xs); display: grid; place-items: center; color: inherit; }
.chip button:hover { background: rgba(0, 74, 153, .1); }
.help { color: var(--color-text-secondary); font-size: 12px; line-height: 16px; margin-top: 6px; }
.field-err { color: var(--color-danger); font-size: 12px; line-height: 16px; margin-top: 6px; }

.sidebar-foot { border-top: 1px solid var(--color-border); padding: 16px; background: var(--color-surface); }
.summary { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; min-height: 24px; }
.summary .s-item { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--color-text); background: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 2px 8px; }
.summary .s-item svg.i { width: 13px; height: 13px; color: var(--color-primary); }
.summary .empty { color: var(--color-text-secondary); font-size: 13px; }
.sidebar-foot .btn.primary { width: 100%; }

/* ---------- sélection manuelle ---------- */
.man-list { display: flex; flex-wrap: wrap; gap: 6px; }
.chip svg.i { width: 13px; height: 13px; }
.range-row { display: flex; gap: 8px; }
.input.mono { font-family: var(--mono); font-size: 13px; }
.input[aria-invalid="true"] { border-color: var(--color-danger); }
.btn.sm.icon { width: 32px; }

/* ---------- zone principale / tableau (§6 Table) ---------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--color-bg); }
.toolbar { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--color-border); background: var(--color-surface); flex-wrap: wrap; }
.tabs { display: flex; gap: 4px; overflow-x: auto; flex: 1; min-width: 120px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: var(--radius-sm); border: 1px solid transparent;
  background: transparent; color: var(--color-text-secondary); cursor: pointer; white-space: nowrap; font-size: 13px; font-weight: 500;
  transition: background-color var(--dur), color var(--dur);
}
.tab:hover { color: var(--color-text); background: var(--color-bg); }
.tab[aria-selected="true"] { color: var(--color-primary); background: var(--color-primary-tint); font-weight: 600; }
#btn-suggest .badge { padding: 0 6px; margin-left: -2px; }
.tab .cnt { font: 600 11px/16px var(--font); color: var(--color-primary); background: var(--color-surface); border: 1px solid #B8CDE6; border-radius: var(--radius-xs); padding: 0 5px; }
.stepper { display: inline-flex; align-items: center; gap: 8px; color: var(--color-text-secondary); font-size: 13px; }
.stepper .box { display: inline-flex; align-items: center; border: 1px solid var(--color-border); border-radius: var(--radius-sm); overflow: hidden; background: var(--color-surface); }
.stepper button { width: 28px; height: 30px; border: 0; background: transparent; color: var(--color-text-secondary); cursor: pointer; display: grid; place-items: center; }
.stepper button:hover { background: var(--color-bg); color: var(--color-text); }
.stepper output { min-width: 28px; text-align: center; color: var(--color-text); font-weight: 600; }

.table-wrap { flex: 1; overflow: auto; position: relative; min-height: 0; background: var(--color-surface); }
table.grid { border-collapse: separate; border-spacing: 0; font-size: 13px; min-width: 100%; }
.grid th, .grid td { padding: 0 12px; height: 36px; border-bottom: 1px solid var(--color-border); border-right: 1px solid var(--color-border); white-space: nowrap; max-width: 280px; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.grid thead th { position: sticky; top: 0; z-index: 2; background: var(--color-bg); height: 44px; padding: 0; font-weight: 500; color: var(--color-text-secondary); }
.grid th.rn, .grid td.rn { position: sticky; left: 0; z-index: 1; background: var(--color-bg); color: var(--color-text-secondary); text-align: right; font: 12px var(--mono); padding: 0 10px; min-width: 52px; }
.grid thead th.rn { z-index: 3; }
.grid tbody tr:hover td { background: var(--color-bg); }
.grid tbody tr:hover td.m { background: var(--color-primary-tint); }
.th-btn {
  display: flex; align-items: center; gap: 8px; width: 100%; height: 100%; padding: 0 12px; border: 0; background: transparent;
  cursor: pointer; text-align: left; color: var(--color-text); font-weight: 600; font-size: 13px; transition: background-color var(--dur);
}
.th-btn:hover { background: #EDF1F6; }
.th-btn .l { font: 500 11px var(--mono); color: var(--color-text-secondary); }
.th-btn .lock { color: var(--color-text-secondary); opacity: 0; transition: opacity var(--dur); }
.th-btn:hover .lock { opacity: 1; }
.grid th.m { background: var(--color-primary-tint); box-shadow: inset 0 -2px 0 var(--color-primary); }
.grid th.m .th-btn { color: var(--color-primary); }
.grid th.m .th-btn .l { color: var(--color-primary-light); }
.grid th.m .th-btn .lock { opacity: 1; color: var(--color-primary); }
.grid td.m { background: var(--color-primary-wash); }
.grid td.tok { font-family: var(--mono); font-size: 12px; color: var(--color-primary); }
.grid td .t { font-family: var(--mono); font-size: 12px; color: var(--color-primary); background: var(--color-primary-tint); border-radius: var(--radius-xs); padding: 1px 4px; }
.grid td.empty { color: var(--color-text-secondary); }
.grid td[data-c] { cursor: cell; }
.grid td[data-c]:hover { box-shadow: inset 0 0 0 1px var(--color-primary-light); }
.grid td.pick { background: var(--color-primary-tint); }
.grid td.drag { background: rgba(30, 99, 181, .16); box-shadow: inset 0 0 0 1px var(--color-primary-light); }
.grid td.rn { padding: 0; }
.rn-btn { display: flex; align-items: center; justify-content: flex-end; gap: 4px; width: 100%; height: 100%; padding: 0 10px; border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; }
.rn-btn:hover { background: #EDF1F6; color: var(--color-text); }
.grid td.rn.m { background: var(--color-primary-tint); color: var(--color-primary); box-shadow: inset -2px 0 0 var(--color-primary); }
.grid td.rn.m svg.i { width: 12px; height: 12px; }
.grid td.unk { background: var(--color-accent-tint); color: var(--color-cta-hover); font-family: var(--mono); font-size: 12px; }

.table-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px; border-top: 1px solid var(--color-border); color: var(--color-text-secondary); font-size: 12px; background: var(--color-surface); }
.legend { display: flex; align-items: center; gap: 16px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.nokey-banner { display: none; align-items: center; gap: 12px; padding: 10px 16px; background: var(--color-accent-tint); color: var(--color-text); font-size: 13px; border-bottom: 1px solid #F6D3A8; }
.nokey-banner svg { color: var(--color-accent-hover); }
.nokey-banner.show { display: flex; }
.nokey-banner .btn { margin-left: auto; }

.tooltip {
  position: fixed; z-index: var(--z-tooltip); pointer-events: none; max-width: 360px; padding: 8px 12px; border-radius: var(--radius-sm);
  background: var(--color-text); color: #fff; box-shadow: var(--shadow-md); font-size: 13px;
  opacity: 0; transition: opacity 120ms;
}
.tooltip.show { opacity: 1; }
.tooltip small { display: block; color: #C5CCD6; font-size: 11px; font-weight: 500; margin-bottom: 2px; }
.tooltip div { white-space: pre-wrap; word-break: break-word; }

/* ---------- vue restauration ---------- */
.restore-layout { flex-direction: column; min-height: 0; }
.result-head { display: flex; align-items: center; gap: 16px; padding: 16px 24px; border-bottom: 1px solid var(--color-border); background: var(--color-surface); flex-wrap: wrap; }
.result-head .ok-ic { width: 44px; height: 44px; border-radius: var(--radius-md); display: grid; place-items: center; background: var(--color-success-tint); color: var(--color-success); flex: none; }
.result-head .t { flex: 1; min-width: 200px; }
.result-head b { font-size: 18px; line-height: 28px; font-weight: 600; display: block; }
.result-head span { color: var(--color-text-secondary); font-size: 13px; }
.warn-box { display: flex; gap: 12px; align-items: flex-start; margin: 12px 24px; padding: 12px 16px; border-radius: var(--radius-md); background: var(--color-accent-tint); border: 1px solid #F6D3A8; color: var(--color-text); font-size: 13px; }
.warn-box svg { color: var(--color-accent-hover); margin-top: 1px; }
.warn-box code { font: 12px var(--mono); color: var(--color-cta-hover); }

/* ---------- boîtes de dialogue (§6 Dialog) ---------- */
.overlay { position: fixed; inset: 0; z-index: var(--z-modal); background: rgba(16, 24, 40, .45); display: none; align-items: center; justify-content: center; padding: 24px; }
.overlay.show { display: flex; animation: fadeIn 150ms var(--ease); }
.modal { width: min(480px, 100%); max-height: 100%; overflow: auto; background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); animation: pop 180ms var(--ease); }
@keyframes pop { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: none; } }
.modal-h { display: flex; align-items: flex-start; gap: 16px; padding: 24px 24px 0; }
.modal-h .mi { width: 40px; height: 40px; border-radius: var(--radius-sm); display: grid; place-items: center; flex: none; background: var(--color-primary-tint); color: var(--color-primary); }
.modal-h .mi.ok { background: var(--color-success-tint); color: var(--color-success); }
.modal-h .mi.bad { background: var(--color-danger-tint); color: var(--color-danger); }
.modal-h .mi.warn { background: var(--color-accent-tint); color: var(--color-accent-hover); }
.modal-h h2 { margin: 0; font-size: 18px; line-height: 28px; font-weight: 600; }
.modal-h p { margin: 2px 0 0; color: var(--color-text-secondary); font-size: 14px; }
.modal-h .x { margin-left: auto; margin-top: -6px; margin-right: -8px; }
.modal-b { padding: 20px 24px; }
.modal-f { padding: 16px 24px 24px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); border: 1px solid var(--color-border); border-radius: var(--radius-md); margin-bottom: 16px; }
.stat { padding: 12px 16px; }
.stat + .stat { border-left: 1px solid var(--color-border); }
.stat b { display: block; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; color: var(--color-primary); }
.stat span { color: var(--color-text-secondary); font-size: 13px; }
.file-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-md); border: 1px solid var(--color-border); margin-bottom: 8px; }
.file-row .ic { width: 34px; height: 34px; border-radius: var(--radius-sm); display: grid; place-items: center; flex: none; }
.file-row.send .ic { background: var(--color-primary-tint); color: var(--color-primary); }
.file-row.keep { background: var(--color-accent-tint); border-color: #F6D3A8; }
.file-row.keep .ic { background: var(--color-surface); color: var(--color-accent-hover); }
.file-row .meta { flex: 1; min-width: 0; }
.file-row small { display: block; font-size: 12px; font-weight: 500; color: var(--color-text-secondary); }
.file-row b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.key-path { font: 12px/18px var(--mono); color: var(--color-text-secondary); word-break: break-all; }
.key-block { padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--color-border); margin-bottom: 12px; }
.key-block .top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.key-block .top svg { color: var(--color-primary); }
.key-block .top b { flex: 1; font-weight: 600; }
.note { display: flex; gap: 12px; padding: 12px 16px; border-radius: var(--radius-md); font-size: 13px; }
.note svg { flex: none; margin-top: 1px; }
.note.warn { background: var(--color-accent-tint); color: var(--color-text); border: 1px solid #F6D3A8; }
.note.warn svg { color: var(--color-accent-hover); }
.note.info { background: var(--color-primary-tint); color: var(--color-text); border: 1px solid #C9DAEE; }
.note.info svg { color: var(--color-primary); }

.progress { height: 6px; border-radius: 3px; background: var(--color-border); overflow: hidden; margin: 12px 0 8px; }
.progress div { height: 100%; width: 0; border-radius: 3px; background: var(--color-primary); transition: width 200ms var(--ease); }
.progress.indet div { width: 35%; animation: indet 1.1s ease-in-out infinite; }
@keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
.spinner { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #C9DAEE; border-top-color: var(--color-primary); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- toasts (§6 : en haut à droite, 4 s) ---------- */
.toasts { position: fixed; right: 24px; top: 80px; z-index: var(--z-toast); display: flex; flex-direction: column; gap: 8px; }
.toast {
  display: flex; align-items: center; gap: 12px; min-width: 280px; max-width: 420px; padding: 12px 16px; border-radius: var(--radius-md);
  background: var(--color-surface); border: 1px solid var(--color-border); box-shadow: var(--shadow-md); font-size: 14px;
  animation: slideIn 180ms var(--ease);
}
.toast.ok svg { color: var(--color-success); }
.toast.bad svg { color: var(--color-danger); }
.toast.info svg { color: var(--color-primary); }
.toast.out { animation: slideOut 130ms var(--ease) forwards; }
@keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
@keyframes slideOut { to { opacity: 0; transform: translateY(-6px); } }

/* ---------- glisser-déposer global ---------- */
.drag-veil {
  position: fixed; inset: 12px; z-index: var(--z-overlay); border: 2px dashed var(--color-primary); border-radius: var(--radius-lg);
  background: rgba(245, 247, 250, .92); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
  pointer-events: none; font-size: 18px; font-weight: 600; color: var(--color-primary);
}
.drag-veil.show { display: flex; animation: fadeIn 120ms; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
}
@media (max-width: 1180px) {
  .workspace { grid-template-columns: 300px 1fr; }
  .brand small, .brand-sep + div small { display: none; }
  .status-pills .pill { max-width: 170px; }
}

/* ---------- profil, lots, contrôle, mot de passe ---------- */
[hidden] { display: none !important; }
.profile-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.profile-actions #profile-del { margin-left: auto; }
.select-wrap { position: relative; flex: 1; min-width: 0; }
.select-wrap select { appearance: none; -webkit-appearance: none; padding-right: 32px; cursor: pointer; text-overflow: ellipsis; }
.select-wrap svg { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--color-text-secondary); pointer-events: none; }
.batch-cta { margin-top: 16px; }
.det-group { font-size: 12px; font-weight: 500; color: var(--color-text-secondary); margin: 12px 0 6px; }
.det-group:first-child { margin-top: 0; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
.pw-wrap { position: relative; }
.pw-wrap .input { padding-right: 44px; }
.pw-wrap button { position: absolute; right: 4px; top: 4px; width: 32px; height: 32px; border: 0; background: transparent; border-radius: var(--radius-xs); color: var(--color-text-secondary); cursor: pointer; display: grid; place-items: center; }
.pw-wrap button:hover { background: var(--color-bg); color: var(--color-text); }
.input.err { border-color: var(--color-danger); }
.finding { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-top: 1px solid var(--color-border); cursor: pointer; }
.finding:first-child { border-top: 0; }
.finding:hover { background: var(--color-bg); }
.finding input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--color-primary); flex: none; }
.finding b { display: block; font-size: 14px; font-weight: 600; }
.finding .where { color: var(--color-text-secondary); font-size: 13px; }
.finding code { font: 12px var(--mono); background: var(--color-accent-tint); color: var(--color-cta-hover); padding: 1px 5px; border-radius: var(--radius-xs); word-break: break-all; }
.finding .fix { display: block; font-size: 12px; color: var(--color-primary); margin-top: 4px; }
.findings { border: 1px solid var(--color-border); border-radius: var(--radius-md); max-height: 340px; overflow: auto; }
.modal.wide { width: min(620px, 100%); }
.batch-list { border: 1px solid var(--color-border); border-radius: var(--radius-md); max-height: 320px; overflow: auto; }
.batch-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--color-border); font-size: 13px; }
.batch-item:first-child { border-top: 0; }
.batch-item .st { width: 24px; height: 24px; border-radius: var(--radius-xs); display: grid; place-items: center; flex: none; }
.batch-item .st.ok { background: var(--color-success-tint); color: var(--color-success); }
.batch-item .st.bad { background: var(--color-danger-tint); color: var(--color-danger); }
.batch-item b { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.batch-item span { color: var(--color-text-secondary); }
.batch-item .warn { color: var(--color-cta-hover); }
.scan-line { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--color-success); margin-bottom: 12px; }
.scan-line.warn { color: var(--color-cta-hover); }
.toast .act { margin-left: auto; border: 0; background: transparent; color: var(--color-primary); font-weight: 600; cursor: pointer; padding: 4px 6px; border-radius: var(--radius-xs); }
.toast .act:hover { background: var(--color-primary-tint); }
.pill.locked { border-color: #F6D3A8; background: var(--color-accent-tint); }

/* ---------- langue ---------- */
:root { --z-dropdown: 1000; }
.top-right { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
.lang { position: relative; }
.lang-btn {
  display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: var(--radius-sm);
  border: 1px solid var(--color-border); background: var(--color-surface); cursor: pointer; font-size: 13px; font-weight: 600;
  transition: border-color var(--dur), background-color var(--dur);
}
.lang-btn:hover { border-color: var(--color-border-strong); background: var(--color-bg); }
.lang-btn .chev { color: var(--color-text-secondary); transition: transform var(--dur) var(--ease); }
.lang-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
.flag { width: 21px; height: 14px; border-radius: 2px; flex: none; display: block; box-shadow: 0 0 0 1px rgba(16, 24, 40, .14); }
.flag.lg { width: 33px; height: 22px; border-radius: 3px; }
.menu {
  position: absolute; right: 0; top: calc(100% + 6px); min-width: 196px; padding: 4px; display: none;
  background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-sm);
  box-shadow: var(--shadow-md); z-index: var(--z-dropdown);
}
.menu.show { display: block; animation: fadeIn 120ms var(--ease); }
.menu button {
  display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px; border: 0;
  border-radius: var(--radius-xs); background: transparent; cursor: pointer; font-size: 14px; text-align: left;
}
.menu button:hover, .menu button:focus-visible { background: var(--color-bg); outline: none; }
.menu button[aria-checked="true"] { color: var(--color-primary); font-weight: 600; }
.menu button .ck { margin-left: auto; color: var(--color-primary); visibility: hidden; }
.menu button[aria-checked="true"] .ck { visibility: visible; }
.lang-grid { display: grid; gap: 8px; }
.lang-choice {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px; width: 100%; text-align: left;
  border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); cursor: pointer;
  transition: border-color var(--dur), background-color var(--dur);
}
.lang-choice:hover, .lang-choice:focus-visible { border-color: var(--color-primary); background: var(--color-primary-wash); }
.lang-choice.suggested { border-color: #B8CDE6; }
.lang-choice b { display: block; font-size: 15px; font-weight: 600; }
.lang-choice span { color: var(--color-text-secondary); font-size: 13px; }
.lang-choice .arrow { margin-left: auto; color: var(--color-text-secondary); }
.grid th .th-tok { font-family: var(--mono); font-size: 12px; font-weight: 500; }
.opt-list.tight { margin-top: 8px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img class="brand-logo" src="logo.svg" alt="DIVE Turbinen GmbH &amp; Co. KG">
    <span class="brand-sep" aria-hidden="true"></span>
    <div><b>ExcelCrypt</b><small data-i18n="brandSub"></small></div>
  </div>
  <nav class="seg" role="tablist" data-i18n-aria="modeAria">
    <button role="tab" id="tab-protect" aria-selected="true" onclick="setMode('protect')"><svg class="i sm"><use href="#i-lock"/></svg><span data-i18n="protect"></span></button>
    <button role="tab" id="tab-restore" aria-selected="false" onclick="setMode('restore')"><svg class="i sm"><use href="#i-unlock"/></svg><span data-i18n="restore"></span></button>
  </nav>
  <div class="top-right">
    <div class="lang" id="lang">
      <button class="lang-btn" id="lang-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="lang-menu" data-i18n-aria="langAria" onclick="toggleLangMenu()">
        <svg class="flag" id="lang-flag"><use href="#f-fr"/></svg><span id="lang-code">FR</span><svg class="i sm chev"><use href="#i-chevron"/></svg>
      </button>
      <div class="menu" id="lang-menu" role="menu"></div>
    </div>
    <button class="pill" id="pill-key" onclick="openKeyModal()" data-i18n-aria="keyAria"><svg class="i sm"><use href="#i-key"/></svg><span class="t" id="pill-key-t">…</span><span class="state" id="pill-key-s"></span></button>
    <button class="pill" id="pill-vault" onclick="openKeyModal()" data-i18n-aria="vaultAria"><svg class="i sm"><use href="#i-db"/></svg><span class="t" id="pill-vault-t">…</span></button>
  </div>
</header>

<main>
  <!-- ===== Protéger : accueil ===== -->
  <section class="view welcome active" id="v-protect-empty">
    <div class="mark"><span class="diamond"></span><span data-i18n="protect"></span></div>
    <h1 data-i18n="welcomeTitle"></h1>
    <p class="lead" data-i18n="welcomeLead"></p>
    <button class="dropzone" id="dz-protect" onclick="pickAndLoad()">
      <div class="dz-icon"><svg class="i xl"><use href="#i-sheet"/></svg></div>
      <h2 data-i18n="dropExcel"></h2>
      <p><span data-i18n-html="orBrowse"></span> · <span class="kbd" id="kbd-open">⌘O</span></p>
      <div class="formats"><span>.xlsx</span><span>.xlsm</span><span>.csv</span><span>.tsv</span></div>
    </button>
    <button class="btn secondary batch-cta" onclick="batchModal()"><svg class="i sm"><use href="#i-folders"/></svg><span data-i18n="batchProtect"></span></button>
    <div class="steps">
      <div class="step"><div class="n">01</div><div><b data-i18n="step1"></b><span data-i18n="step1Sub"></span></div></div>
      <div class="step"><div class="n">02</div><div><b data-i18n="step2"></b><span data-i18n="step2Sub"></span></div></div>
      <div class="step"><div class="n">03</div><div><b data-i18n="step3"></b><span data-i18n="step3Sub"></span></div></div>
    </div>
  </section>

  <!-- ===== Protéger : espace de travail ===== -->
  <section class="view workspace" id="v-protect-work">
    <aside class="sidebar">
      <div class="sidebar-scroll">
        <div class="file-card">
          <div class="ic"><svg class="i"><use href="#i-sheet"/></svg></div>
          <div class="meta"><b id="f-name"></b><span id="f-meta"></span></div>
          <button class="btn sm ghost" onclick="pickAndLoad()" data-i18n="change" data-i18n-title="changeTitle"></button>
        </div>

        <div>
          <div class="section-h"><h3><label for="profile-select" data-i18n="profile"></label></h3></div>
          <div class="select-wrap">
            <select class="input" id="profile-select" onchange="onProfileSelect(this.value)"></select>
            <svg class="i sm"><use href="#i-chevron"/></svg>
          </div>
          <div class="profile-actions">
            <button class="btn sm" onclick="saveProfileModal()"><svg class="i sm"><use href="#i-save"/></svg><span data-i18n="saveProfile"></span></button>
            <button class="btn sm ghost" id="profile-batch" onclick="batchModal()" hidden><svg class="i sm"><use href="#i-folders"/></svg><span data-i18n="batchWithProfile"></span></button>
            <button class="btn sm icon ghost" id="profile-del" onclick="deleteProfileModal()" data-i18n-aria="deleteProfileAria" data-i18n-title="deleteProfileAria" hidden><svg class="i sm"><use href="#i-trash"/></svg></button>
          </div>
        </div>

        <div>
          <div class="section-h">
            <h3><span data-i18n="colsTitle"></span> <span class="badge" id="sel-count">0</span></h3>
          </div>
          <div class="search">
            <svg class="i sm"><use href="#i-search"/></svg>
            <input class="input" id="col-filter" data-i18n-ph="colsFilter" data-i18n-aria="colsFilter" oninput="renderColumns()">
          </div>
          <div class="col-actions">
            <button class="btn sm" id="btn-suggest" onclick="suggest()" data-i18n-title="suggestTitle"><svg class="i sm" style="color:var(--color-accent-hover)"><use href="#i-sparkles"/></svg><span data-i18n="suggest"></span><span class="badge" id="sug-count" hidden></span></button>
            <button class="btn sm" onclick="setAll(true)" data-i18n="all"></button>
            <button class="btn sm" onclick="setAll(false)" data-i18n="none"></button>
          </div>
          <div class="col-list" id="col-list" role="list"></div>
          <div class="opt-list tight">
            <button class="opt-row on" id="opt-maskHeaders" onclick="toggleOpt('maskHeaders')" role="switch" aria-checked="true">
              <svg class="i ic"><use href="#i-heading"/></svg>
              <div class="txt"><b data-i18n="maskHeaders"></b><span data-i18n="maskHeadersSub"></span></div>
              <div class="switch"></div>
            </button>
            <button class="opt-row on" id="opt-propagate" onclick="toggleOpt('propagate')" role="switch" aria-checked="true">
              <svg class="i ic"><use href="#i-share"/></svg>
              <div class="txt"><b data-i18n="propagate"></b><span data-i18n="propagateSub"></span></div>
              <div class="switch"></div>
            </button>
            <button class="opt-row" id="opt-readable" onclick="toggleOpt('readable')" role="switch" aria-checked="false">
              <svg class="i ic"><use href="#i-tag"/></svg>
              <div class="txt"><b data-i18n="readable"></b><span data-i18n="readableSub"></span></div>
              <div class="switch"></div>
            </button>
          </div>
        </div>

        <div>
          <div class="section-h">
            <h3><span data-i18n="manTitle"></span> <span class="badge" id="man-count">0</span></h3>
            <button class="btn sm ghost" id="man-clear" onclick="clearManual()" hidden data-i18n="removeAll"></button>

let LANG = "fr";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const locale = () => LANGS.find((l) => l.code === LANG).locale;
const fmt = (n) => Number(n).toLocaleString(locale());
/* Taille de fichier : unités françaises (o, Ko, Mo) ou internationales (B, KB, MB) */
function fmtSize(b) {
  if (b == null) return "—";
  const units = LANG === "fr" ? ["o", "Ko", "Mo", "Go"] : ["B", "KB", "MB", "GB"];
  let i = 0;
  while (b >= 1024 && i < units.length - 1) { b /= 1024; i++; }
  return `${i ? b.toLocaleString(locale(), { maximumFractionDigits: 1 }) : b} ${units[i]}`;
}
const icon = (id, cls = "") => `<svg class="i ${cls}"><use href="#i-${id}"/></svg>`;
const flag = (code, cls = "") => `<svg class="flag ${cls}"><use href="#f-${code}"/></svg>`;
let api = null;

function t(key, ...args) {
  const v = I18N[LANG]?.[key] ?? I18N.fr[key] ?? key;
  return typeof v === "function" ? v(...args) : v;
}
/* Message d'erreur venant de Python : traduit via son code, sinon texte d'origine */
function errText(res) {
  const v = res.code && (I18N[LANG]["err_" + res.code] ?? I18N.fr["err_" + res.code]);
  if (!v) return res.error;
  return typeof v === "function" ? v(res.params || {}) : v;
}

/* ============================================================
   Langue
   ============================================================ */
function applyI18n() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t(el.dataset.i18n)));
  document.querySelectorAll("[data-i18n-html]").forEach((el) => (el.innerHTML = t(el.dataset.i18nHtml)));
  document.querySelectorAll("[data-i18n-ph]").forEach((el) => (el.placeholder = t(el.dataset.i18nPh)));
  document.querySelectorAll("[data-i18n-title]").forEach((el) => (el.title = t(el.dataset.i18nTitle)));
  document.querySelectorAll("[data-i18n-aria]").forEach((el) => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  document.querySelectorAll(".reveal-label").forEach((e) => (e.textContent = revealLabel()));
  $("#lang-flag").innerHTML = `<use href="#f-${LANG}"/>`;
  $("#lang-code").textContent = LANG.toUpperCase();
  $("#lang-menu").innerHTML = LANGS.map((l) =>
    `<button role="menuitemradio" aria-checked="${l.code === LANG}" onclick="setLang('${l.code}')">${flag(l.code)}${l.name}${icon("check", "sm ck")}</button>`).join("");
  // parties dynamiques
  if (S.key) applyState({ platform: S.platform, key: S.key, vault: S.vault, lang: LANG });
  if (S.file) { renderAll(); $("#f-meta").textContent = `${fmtSize(S.file.bytes)} · ${t("sheetsCount", S.sheets.length)}`; }
  renderChips("values"); renderChips("regexes");
  renderDetectors(); renderProfiles();
  if (!$("#range-err").hidden) $("#range-err").hidden = true;
  if (S.restore) renderRestoreResult();
}
async function setLang(code, silent = false) {
  LANG = code;
  closeLangMenu();
  applyI18n();
  await api.set_lang(code);
  if (S.langRequired) { S.langRequired = false; closeModal(); if (S.key?.locked) unlockModal(); }
  else if (!silent) toast(t("langChanged"), "ok");
}
function toggleLangMenu() {
  const open = !$("#lang-menu").classList.contains("show");
  $("#lang-menu").classList.toggle("show", open);
  $("#lang-btn").setAttribute("aria-expanded", open);
  if (open) $("#lang-menu").querySelector('[aria-checked="true"]')?.focus();
}
function closeLangMenu() { $("#lang-menu").classList.remove("show"); $("#lang-btn").setAttribute("aria-expanded", "false"); }
document.addEventListener("click", (e) => { if (!e.target.closest("#lang")) closeLangMenu(); });
$("#lang-menu").addEventListener("keydown", (e) => {
  const items = [...$("#lang-menu").querySelectorAll("button")];
  const i = items.indexOf(document.activeElement);
  if (e.key === "ArrowDown") { e.preventDefault(); items[(i + 1) % items.length].focus(); }
  if (e.key === "ArrowUp") { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
  if (e.key === "Escape") { closeLangMenu(); $("#lang-btn").focus(); }
});

  const guess = (navigator.language || "fr").slice(0, 2);
  const sub = { fr: I18N.fr.langSub, de: I18N.de.langSub, en: I18N.en.langSub };
  S.langRequired = true;

/* ============================================================

async function pickAndLoad() {

async function loadFile(path, headerRow) {

  closeModal();
  if (res.error) return errorModal(t("openFailed"), errText(res));
  const sameFile = S.file && S.file.path === res.file.path;
  S.file = res.file; S.sheets = res.sheets; S.headerRow = headerRow;
  if (!sameFile) { S.selection = {}; S.sheet = 0; S.view = "original"; S.profile = ""; S.scanClean = null; resetHistory(); setView("original"); }
  S.sheet = Math.min(S.sheet, S.sheets.length - 1);

}
function stepHeader(d) {
  if (!S.file) return;
  const n = Math.max(1, Math.min(100, S.headerRow + d));
  if (n !== S.headerRow) loadFile(S.file.path, n);
}

const cur = () => S.sheets[S.sheet];
/* Sélection d'une feuille : colonnes, lignes et cellules cochées à la main + plages saisies.
   Lignes et colonnes numérotées comme dans Excel (1-based). */
function sel(name = cur()?.name) {
  return (S.selection[name] ??= { cols: new Set(), rows: new Set(), cells: new Set(), ranges: [] });
}
const cellKey = (r, c) => r + "," + c;
function colLetter(n) { let s = ""; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
const inRange = (g, r, c) => g.rows.some(([a, b]) => r >= a && r <= b) || g.rects.some(([r1, c1, r2, c2]) => r >= r1 && r <= r2 && c >= c1 && c <= c2);
const rowMasked = (m, r) => m.rows.has(r) || m.ranges.some((g) => g.rows.some(([a, b]) => r >= a && r <= b));
const isMasked = (m, r, c) => m.cols.has(c) || m.rows.has(r) || m.cells.has(cellKey(r, c)) || m.ranges.some((g) => inRange(g, r, c));
const selSize = (m) => m.cols.size + m.rows.size + m.cells.size + m.ranges.length;

function compressRows(set) {
  const out = [];
  for (const r of [...set].sort((a, b) => a - b)) {
    const last = out[out.length - 1];
    if (last && r === last[1] + 1) last[1] = r; else out.push([r, r]);
  }
  return out;
}
function selectionPayload(m) {
  const out = { cols: [...m.cols], rows: compressRows(m.rows), cells: [...m.cells].map((k) => k.split(",").map(Number)), rects: [] };
  for (const g of m.ranges) { out.rows.push(...g.rows); out.rects.push(...g.rects); }
  return out;
}

/* Historique pour ⌘Z / Ctrl+Z */
const history = [];
function snapshot() {
  return JSON.stringify({
    opts: S.opts,
    sel: Object.fromEntries(Object.entries(S.selection).map(([k, m]) =>
      [k, { cols: [...m.cols], rows: [...m.rows], cells: [...m.cells], ranges: m.ranges }])),
  });
}
function pushHistory() { history.push(snapshot()); if (history.length > 100) history.shift(); $("#btn-undo").disabled = false; }
function resetHistory() { history.length = 0; $("#btn-undo").disabled = true; }
function undo() {
  if (!history.length) return;
  const d = JSON.parse(history.pop());
  S.selection = {};
  for (const [k, m] of Object.entries(d.sel)) S.selection[k] = { cols: new Set(m.cols), rows: new Set(m.rows), cells: new Set(m.cells), ranges: m.ranges };
  S.opts = d.opts;
  $("#btn-undo").disabled = !history.length;
  syncOpts();
  renderAll();
}

/* ============================================================
   Rendu
   ============================================================ */
function renderAll() { renderTabs(); renderColumns(); renderManual(); renderTable(); renderSummary(); refreshAi(); }

function renderTabs() {
  $("#sheet-tabs").innerHTML = S.sheets.map((s, i) => {
    const n = selSize(sel(s.name));
    return `<button class="tab" role="tab" aria-selected="${i === S.sheet}" onclick="selectSheet(${i})">${icon("sheet", "sm")}${esc(s.name)}${n ? `<span class="cnt">${n}</span>` : ""}</button>`;
  }).join("");
}
function selectSheet(i) { S.sheet = i; S.aiRows = null; lastRow = lastCell = null; renderAll(); }

function renderColumns() {
  const s = cur(); if (!s) return;
  const q = $("#col-filter").value.trim().toLowerCase();
  const m = sel();
  const cols = s.columns.filter((c) => !q || c.name.toLowerCase().includes(q) || c.letter.toLowerCase() === q);
  $("#col-list").innerHTML = cols.map((c) => {
    const on = m.cols.has(c.idx);
    return `<button class="col-item ${on ? "on" : ""}" role="switch" aria-checked="${on}" onclick="toggleCol(${c.idx})"
        data-tip-title="${esc(t("example"))}" data-tip="${esc(c.example || t("emptyVal"))}">
      <span class="col-letter">${c.letter}</span>
      <span class="col-main">
        <b class="${c.name ? "" : "none"}">${esc(c.name || t("noHeader"))}</b>
        <span class="num">${c.suggested ? `<span class="tag-sug">${icon("sparkles")}${t("sensitive")}</span> · ` : ""}${t("colStats", c.unique, c.empty)}</span>
      </span>
      <span class="switch"></span>
    </button>`;
  }).join("") || `<div class="help" style="padding:8px 12px">${t("noColMatch")}</div>`;
  $("#sel-count").textContent = m.cols.size;
  const pending = s.columns.filter((c) => c.suggested && !m.cols.has(c.idx)).length;
  $("#sug-count").hidden = !pending;
  $("#sug-count").textContent = pending;
}

function renderManual() {
  const m = sel(); if (!cur()) return;
  const chips = [];
  for (const [a, b] of compressRows(m.rows))
    chips.push(`<span class="chip">${icon("rows", "sm")}<span>${t("rowLabel", a, b)}</span><button aria-label="${esc(t("remove"))} ${t("rowLabel", a, b)}" onclick="removeRows(${a},${b})">${icon("x", "sm")}</button></span>`);
  const boxes = groupCells(m.cells);
  boxes.slice(0, 12).forEach(([r1, c1, r2, c2]) => {
    const label = r1 === r2 && c1 === c2 ? `${colLetter(c1)}${r1}` : `${colLetter(c1)}${r1}:${colLetter(c2)}${r2}`;
    chips.push(`<span class="chip mono">${icon("grid", "sm")}<span>${label}</span><button aria-label="${esc(t("remove"))} ${label}" onclick="removeBox(${r1},${c1},${r2},${c2})">${icon("x", "sm")}</button></span>`);
  });
  if (boxes.length > 12)
    chips.push(`<span class="chip"><span>${t("moreZones", boxes.length - 12)}</span><button aria-label="${esc(t("removeAllCells"))}" onclick="clearCells()">${icon("x", "sm")}</button></span>`);
  m.ranges.forEach((g, i) =>
    chips.push(`<span class="chip mono">${icon(g.rects.length ? "grid" : "rows", "sm")}<span>${esc(rangeLabel(g))}</span><button aria-label="${esc(t("remove"))} ${esc(rangeLabel(g))}" onclick="removeRange(${i})">${icon("x", "sm")}</button></span>`));
  $("#man-list").innerHTML = chips.join("") || `<span class="help" style="margin:0">${t("manEmpty")}</span>`;
  const n = m.rows.size + m.cells.size + m.ranges.length;
  $("#man-count").textContent = n;
  $("#man-clear").hidden = !n;
}

function renderTable() {
  const s = cur(); if (!s) return;
  const m = sel();
  const ai = S.view === "ai" && S.aiRows;
  const rows = ai ? S.aiRows : s.rows;
  const hr = S.headerRow;
  let h = `<thead><tr><th class="rn">#</th>`;
  for (const c of s.columns) {
    const on = m.cols.has(c.idx);
    const hTok = ai && S.aiHeader && S.aiHeader[c.idx - 1] !== c.name ? S.aiHeader[c.idx - 1] : null;
    const hTip = hTok ? ` data-tip-title="${esc(t("realHeader"))}" data-tip="${esc(c.name)}"` : "";
    h += `<th class="${on ? "m" : ""}"${hTip}><button class="th-btn" onclick="toggleCol(${c.idx})" aria-pressed="${on}" title="${esc(t(on ? "colRelease" : "colProtect", c.letter))}">
      <span class="l">${c.letter}</span><span class="${hTok ? "th-tok" : ""}" style="overflow:hidden;text-overflow:ellipsis">${esc(hTok || c.name)}</span>
      <svg class="i sm lock" style="margin-left:auto"><use href="#i-${on ? "lock" : "unlock"}"/></svg></button></th>`;
  }
  h += `</tr></thead><tbody>`;
  const parts = [];
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r], orig = s.rows[r], R = hr + 1 + r;
    const rOn = rowMasked(m, R);
    let tr = `<tr><td class="rn ${rOn ? "m" : ""}"><button class="rn-btn" data-row="${R}" aria-pressed="${rOn}" title="${esc(t(rOn ? "rowRelease" : "rowProtect", R))}">${rOn ? icon("lock", "sm") : ""}${R}</button></td>`;
    for (let i = 0; i < s.columns.length; i++) {
      const v = row[i] ?? "", o = orig[i] ?? "", C = i + 1;
      const cls = [];
      if (isMasked(m, R, C)) cls.push("m");
      if (m.cells.has(cellKey(R, C))) cls.push("pick");
      let content = esc(v);
      if (v === "") cls.push("empty");
      let tip = "";
      if (ai && v !== o) {
        if (TOKEN_WHOLE.test(v)) cls.push("tok");
        else content = esc(v).replace(TOKEN_ANY, (tok) => `<span class="t">${tok}</span>`);
        tip = ` data-tip-title="${esc(t("realValue"))}" data-tip="${esc(o)}"`;
      }
      tr += `<td data-r="${R}" data-c="${C}" class="${cls.join(" ")}"${tip}>${content}</td>`;
    }
    parts.push(tr + "</tr>");
  }
  $("#grid-protect").innerHTML = h + parts.join("") + "</tbody>";
  const shown = s.rows.length;
  $("#rows-info").textContent = s.total > shown ? t("rowsShown", shown, s.total) : t("rowsTotal", s.total);
}

function renderSummary() {
  const items = [];
  let nCols = 0, estimate = 0, nRows = 0, nCells = 0;
  for (const s of S.sheets) {
    const m = sel(s.name);
    nCols += m.cols.size;
    const ratio = s.rows.length ? s.total / s.rows.length : 0;
    for (const c of s.columns) if (m.cols.has(c.idx)) estimate += c.filled * ratio;
    nRows += m.rows.size;
    nCells += m.cells.size;
    for (const g of m.ranges) {
      for (const [a, b] of g.rows) nRows += b - a + 1;
      for (const [r1, c1, r2, c2] of g.rects) nCells += (r2 - r1 + 1) * (c2 - c1 + 1);
    }
  }
  const o = S.opts;
  const work = nCols || nRows || nCells || o.detectors.length || o.values.length || o.regexes.length;
  if (nCols) items.push(`${icon("lock")}${t("sumCols", nCols, Math.round(estimate))}`);
  if (nCols && o.maskHeaders) items.push(`${icon("heading")}${t("sumHeaders")}`);
  if (nRows) items.push(`${icon("rows")}${t("sumRows", nRows)}`);
  if (nCells) items.push(`${icon("grid")}${t("sumCells", nCells)}`);
  if (o.propagate && (nCols || nRows || nCells)) items.push(`${icon("share")}${t("sumPropagate")}`);
  if (o.detectors.length) items.push(`${icon("id")}${t("sumDetectors", o.detectors.length)}`);
  if (o.values.length) items.push(`${icon("type")}${t("sumValues", o.values.length)}`);
  if (o.regexes.length) items.push(`${icon("code")}${t("sumRegex", o.regexes.length)}`);
  if (work && o.readable) items.push(`${icon("tag")}${t("sumReadable")}`);
  $("#summary").innerHTML = work ? items.map((x) => `<span class="s-item">${x}</span>`).join("")
    : `<span class="empty">${t("sumEmpty")}</span>`;
  $("#btn-encrypt").disabled = !work || S.busy;
}

/* ============================================================
   Interactions sélection
   ============================================================ */
function toggleCol(idx) {
  pushHistory();
  const m = sel();
  m.cols.has(idx) ? m.cols.delete(idx) : m.cols.add(idx);
  renderAll();
}
function setAll(on) {
  pushHistory();
  const m = sel(); m.cols.clear();
  if (on) cur().columns.forEach((c) => m.cols.add(c.idx));
  renderAll();
}
function suggest() {
  const m = sel();
  const sug = cur().columns.filter((c) => c.suggested);
  if (!sug.length) return toast(t("suggestNone"), "info");
  pushHistory();
  sug.forEach((c) => m.cols.add(c.idx));
  renderAll();
  toast(t("suggestDone", sug.length), "ok");
}

/* Lignes : clic = bascule, Maj+clic = plage depuis la dernière ligne cliquée */
let lastRow = null;
function toggleRow(r, shift) {
  pushHistory();
  const m = sel();
  if (shift && lastRow !== null) {
    const on = !m.rows.has(r);
    for (let x = Math.min(lastRow, r); x <= Math.max(lastRow, r); x++) on ? m.rows.add(x) : m.rows.delete(x);
  } else m.rows.has(r) ? m.rows.delete(r) : m.rows.add(r);
  lastRow = r;
  renderAll();
}
function removeRows(a, b) { pushHistory(); const m = sel(); for (let x = a; x <= b; x++) m.rows.delete(x); renderAll(); }
function removeBox(r1, c1, r2, c2) {
  pushHistory();
  const m = sel();
  for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) m.cells.delete(cellKey(r, c));
  renderAll();
}
/* Regroupe les cellules cochées en rectangles pleins (affichage compact : B8:D10 au lieu de 9 étiquettes) */
function groupCells(set) {
  const left = new Set(set), boxes = [];
  const sorted = [...set].map((k) => k.split(",").map(Number)).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  for (const [r, c] of sorted) {
    if (!left.has(cellKey(r, c))) continue;
    let c2 = c;
    while (left.has(cellKey(r, c2 + 1))) c2++;
    let r2 = r;
    const fullRow = (rr) => { for (let x = c; x <= c2; x++) if (!left.has(cellKey(rr, x))) return false; return true; };
    while (fullRow(r2 + 1)) r2++;
    for (let rr = r; rr <= r2; rr++) for (let x = c; x <= c2; x++) left.delete(cellKey(rr, x));
    boxes.push([r, c, r2, c2]);
  }
  return boxes;
}
function clearCells() { pushHistory(); sel().cells.clear(); renderAll(); }
function rangeLabel(g) {
  if (g.rects.length) { const [r1, c1, r2, c2] = g.rects[0]; return `${colLetter(c1)}${r1}:${colLetter(c2)}${r2}`; }
  const [a, b] = g.rows[0]; return t("rowLabel", a, b);
}
function removeRange(i) { pushHistory(); sel().ranges.splice(i, 1); renderAll(); }
function clearManual() { pushHistory(); const m = sel(); m.rows.clear(); m.cells.clear(); m.ranges = []; renderAll(); }

/* Cellules : clic = bascule, glisser = zone, Maj+clic = zone depuis la dernière cellule */
let drag = null, lastCell = null;
const grid = $("#grid-protect");
grid.addEventListener("click", (e) => {
  const b = e.target.closest(".rn-btn");
  if (b) toggleRow(+b.dataset.row, e.shiftKey);
});
grid.addEventListener("mousedown", (e) => {
  const td = e.target.closest("td[data-c]");
  if (!td || e.button !== 0) return;
  e.preventDefault();
  hideTip();
  const r = +td.dataset.r, c = +td.dataset.c;
  const from = e.shiftKey && lastCell ? lastCell : { r, c };
  drag = { r0: from.r, c0: from.c, r1: r, c1: c, add: e.shiftKey || !sel().cells.has(cellKey(r, c)) };
  paintDrag();
  if (e.shiftKey) finishDrag();
});
grid.addEventListener("mouseover", (e) => {
  if (!drag) return;
  const td = e.target.closest("td[data-c]");
  if (!td) return;
  const r = +td.dataset.r, c = +td.dataset.c;
  if (r !== drag.r1 || c !== drag.c1) { drag.r1 = r; drag.c1 = c; paintDrag(); }
});
document.addEventListener("mouseup", () => { if (drag) finishDrag(); });
function dragBox() {
  return [Math.min(drag.r0, drag.r1), Math.min(drag.c0, drag.c1), Math.max(drag.r0, drag.r1), Math.max(drag.c0, drag.c1)];
}
function paintDrag() {
  grid.querySelectorAll("td.drag").forEach((t) => t.classList.remove("drag"));
  const [r1, c1, r2, c2] = dragBox(), first = S.headerRow + 1, body = grid.tBodies[0];
  for (let r = r1; r <= r2; r++) {
    const tr = body.rows[r - first];
    if (!tr) continue;
    for (let c = c1; c <= c2; c++) tr.cells[c]?.classList.add("drag");
  }
}
function finishDrag() {
  const [r1, c1, r2, c2] = dragBox(), m = sel();
  const single = r1 === r2 && c1 === c2;
  if (single && drag.add && isMasked(m, r1, c1) && !m.cells.has(cellKey(r1, c1))) {
    toast(t(m.cols.has(c1) ? "alreadyByCol" : "alreadyByRow", `${colLetter(c1)}${r1}`), "info");
    drag = null; paintDragClear(); return;
  }
  pushHistory();
  for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) drag.add ? m.cells.add(cellKey(r, c)) : m.cells.delete(cellKey(r, c));
  lastCell = { r: drag.r1, c: drag.c1 };
  drag = null;
  renderAll();
}
function paintDragClear() { grid.querySelectorAll("td.drag").forEach((t) => t.classList.remove("drag")); }

/* Plages saisies (validées par Python : B5, A2:C40, 12-30, D:F, nom de colonne) */
async function addRange() {
  const input = $("#in-range"), err = $("#range-err");
  const text = input.value.trim();
  if (!text || !cur()) return;
  const res = await api.parse_refs(cur().name, text);
  if (res.errors.length) {
    err.hidden = false;
    err.textContent = t("rangeErr", res.errors.join(", "));
    input.setAttribute("aria-invalid", "true");
    return;
  }
  err.hidden = true; input.removeAttribute("aria-invalid");
  pushHistory();
  const m = sel(), p = res.selection;
  p.cols.forEach((c) => m.cols.add(c));
  p.cells.forEach(([r, c]) => m.cells.add(cellKey(r, c)));
  for (const [a, b] of p.rows) {
    if (a === b) m.rows.add(a);
    else m.ranges.push({ rows: [[a, b]], rects: [] });
  }
  for (const [r1, c1, r2, c2] of p.rects) m.ranges.push({ rows: [], rects: [[r1, c1, r2, c2]] });
  input.value = "";
  renderAll();
}
$("#in-range").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); addRange(); } });

function toggleOpt(k) {
  pushHistory();
  S.opts[k] = !S.opts[k];
  syncOpts();
  renderSummary(); refreshAi();
}
function setView(v) {
  S.view = v;
  $("#view-orig").setAttribute("aria-selected", v === "original");
  $("#view-ai").setAttribute("aria-selected", v === "ai");
  if (v === "ai" && !S.aiRows) refreshAi(true); else renderTable();
}

/* Aperçu « vue IA » : les jetons sont calculés côté Python (la clé ne quitte jamais Python) */
let aiTimer = null, aiSeq = 0;
function refreshAi(now = false) {
  S.aiRows = null;
  if (S.view !== "ai") return;
  clearTimeout(aiTimer);
  aiTimer = setTimeout(async () => {
    const s = cur(); if (!s) return;
    const seq = ++aiSeq;
    const all = Object.fromEntries(S.sheets.map((x) => [x.name, selectionPayload(sel(x.name))]));
    const res = await api.preview(s.name, all, S.opts);
    if (seq !== aiSeq) return;  // une requête plus récente est partie entre-temps
    S.aiRows = res.rows;
    S.aiHeader = res.header;
    S.regexErrors = res.regexErrors || {};
    renderChips("regexes");
    renderTable();
  }, now ? 0 : 120);
}



/* Chips (valeurs / regex) */
function setupChips(key, inputId) {
  const input = $(inputId);
  input.addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === ",") && input.value.trim()) {
      e.preventDefault();
      const v = input.value.trim();
      if (!S.opts[key].includes(v)) { pushHistory(); S.opts[key].push(v); }
      input.value = "";
      if (key === "regexes") validateRegex();
      renderChips(key); renderSummary(); refreshAi();
    } else if (e.key === "Backspace" && !input.value && S.opts[key].length) {
      pushHistory(); S.opts[key].pop(); if (key === "regexes") validateRegex(); renderChips(key); renderSummary(); refreshAi();
    }
  });
}
let regexSeq = 0;
function validateRegex() {
  S.regexErrors = {};
  for (const r of S.opts.regexes) { try { new RegExp(r); } catch (e) { S.regexErrors[r] = e.message; } }
  // Les syntaxes JS et Python diffèrent ((?P<nom>…), \A, \Z…) : Python tranche, puisque c'est lui qui les applique.
  const seq = ++regexSeq, pats = [...S.opts.regexes];
  api?.check_regexes(pats).then((errs) => {
    if (seq !== regexSeq) return;
    S.regexErrors = errs || {};
    renderChips("regexes"); renderSummary();
  });
}
function removeChip(key, i) { pushHistory(); S.opts[key].splice(i, 1); if (key === "regexes") validateRegex(); renderChips(key); renderSummary(); refreshAi(); }
function renderChips(key) {
  const box = key === "values" ? $("#chips-values") : $("#chips-regex");
  box.querySelectorAll(".chip").forEach((c) => c.remove());
  const input = box.querySelector("input");
  S.opts[key].forEach((v, i) => {
    const bad = key === "regexes" && S.regexErrors[v];
    const el = document.createElement("span");
    el.className = `chip ${key === "regexes" ? "mono" : ""} ${bad ? "err" : ""}`;
    el.innerHTML = `<span title="${esc(v)}">${esc(v)}</span><button aria-label="${esc(t("remove"))} ${esc(v)}" onclick="event.stopPropagation();removeChip('${key}',${i})">${icon("x", "sm")}</button>`;
    box.insertBefore(el, input);
  });
  if (key === "regexes") {
    const errs = Object.keys(S.regexErrors);
    const e = $("#regex-err");
    e.hidden = !errs.length;
    e.textContent = errs.length ? t("regexErr", errs[0]) : "";
  }
}

async function doEncrypt(skipScan = false) {
  if (!requireKey()) return;
  if (Object.keys(S.regexErrors).length) return errorModal(t("regexModalTitle"), t("regexModalMsg"));
  const selection = {};
  for (const [k, m] of Object.entries(S.selection)) if (selSize(m)) selection[k] = selectionPayload(m);
  if (!skipScan) {
    setBusy(true);
    const sc = await api.scan(selection, S.opts, S.headerRow);
    setBusy(false);
    closeModal();
    if (sc.error) return errorModal(t("encryptFailed"), errText(sc));
    if (sc.findings.length) return leakModal(sc.findings);
    S.scanClean = true;
  }
  setBusy(true);
  const res = await api.encrypt(selection, S.opts, S.headerRow);
  setBusy(false);
  closeModal();
  if (res.cancelled) return;
  if (res.error) return errorModal(t("encryptFailed"), errText(res));
  applyState(res.state);
  successEncryptModal(res);
}
function setBusy(b) { S.busy = b; renderSummary(); }
